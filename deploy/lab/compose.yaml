services:
  juice-shop:
    image: bkimminich/juice-shop:v20.2.0
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  webgoat:
    image: webgoat/webgoat:v2026.4
    environment:
      WEBGOAT_HOST: 0.0.0.0
      WEBWOLF_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19090:9090"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
